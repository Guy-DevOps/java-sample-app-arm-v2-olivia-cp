name: CI Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE: guy187/java-sample-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build com Maven
        run: mvn -B package --file pom.xml

      - name: Login no Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build da imagem
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Push da imagem
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Atualizar manifest do Kubernetes
        run: |
          sed "s/\${IMAGE_TAG}/${{ github.sha }}/g" deployment-template.yaml > deploy/deployment.yaml
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add deploy/deployment.yaml
          git commit -m "Update deployment to SHA ${{ github.sha }}" || exit 0
          git push
